  u.stds.filter(function(s){return s.soon;}).forEach(function(s){var d=document.createElement('div');d.className='cellcard soon';d.innerHTML='<b>'+s.title+'</b><span>'+s.code+' · coming soon</span>';lens.appendChild(d);});
  m.appendChild(lens);
  m.insertAdjacentHTML('beforeend','<div class="panel"><h2>Plan</h2><div class="tw"><table><tr><th>Part</th><th>Minutes</th></tr><tr><td>Toolkit: how to answer like a 3.0</td><td>2</td></tr>'+u.live.map(function(s){return '<tr><td>'+s.title+' ('+s.code+')</td><td>'+s.mins+'</td></tr>';}).join('')+'<tr><td>Mastery check ('+(u.live.length*u.per)+' questions, one try each)</td><td>'+(u.live.length*u.per)+'</td></tr><tr><td>Results and next steps</td><td>about 1</td></tr></table></div></div>');
  var d=document.createElement('div');d.className='nav';var b=document.createElement('button');b.className='btn';b.type='button';b.textContent='All units';b.onclick=goHome;var n=document.createElement('button');n.className='btn primary';n.type='button';n.textContent='Start the review';n.onclick=function(){go(1);};d.appendChild(b);d.appendChild(n);m.appendChild(d);
  if(S.R[u.i]){var j=document.createElement('p');j.className='muted noprint';j.innerHTML='Already reviewed? <button class="btn small" type="button" id="jumpM">Go straight to the mastery check</button>';m.appendChild(j);$('jumpM').onclick=function(){st().mastery=null;go(screens(u).indexOf('mastery'));};}}

function renderToolkit(m){var u=U();
  m.insertAdjacentHTML('beforeend','<p class="secmeta">Toolkit · about 2 minutes</p><h1>How to answer like a 3.0</h1><div class="panel"><p>Most of each standard’s points come from <b>explaining</b>, not naming. Use these four steps on every “explain” or “predict” question:</p><ol><li><b>Name it.</b> The structure, process, or idea (this is the 2.0 part).</li><li><b>Say what it does.</b> Use the wording from your notes.</li><li><b>Connect with “because… so…”.</b> Link it to the situation in the question.</li><li><b>Predict.</b> What changes if it fails, is missing, or conditions change?</li></ol><p>Claim, evidence, reasoning works too: claim = your answer, evidence = the fact from the question or your notes, reasoning = the “because… so…” that connects them.</p></div>'+
  '<div class="panel"><h2>One move per standard</h2><div class="tw"><table><tr><th>Standard</th><th>3.0 move</th></tr>'+u.live.map(function(s){return '<tr><td><b>'+s.code+'</b> '+s.title+'</td><td>'+s.move.charAt(0).toUpperCase()+s.move.slice(1)+'</td></tr>';}).join('')+'</table></div><p class="muted">Each Learn page has a pink “3.0 move” box that shows the move in action. The <b>Reference sheet</b> button at the top stays on every screen.</p></div>');
  m.appendChild(nav(true,'Start '+u.live[0].code));}

// ---------- practice ----------
function uniq(gens){var seen={};return gens.map(function(g){var q,k=0;do{q=newQ(g);k++;}while(seen[sig(q)]&&k<12);seen[sig(q)]=1;q._g=g;return q;});}
function renderPractice(m,i){var u=U(),s=u.live[i],x=st();
  m.insertAdjacentHTML('beforeend','<p class="secmeta">'+s.code+' · Practice · about 5 minutes</p><h1>Practice: '+s.title+'</h1><p class="muted">Level 2.0 foundations first, then Level 3.0 explain-and-apply questions. Up to 3 tries each.</p>');
  if(!x.prac[i])x.prac[i]=uniq(s.practice);
  x.prac[i].forEach(function(q,k){m.appendChild(pcard(s,i,k,q));});
  m.appendChild(nav(true,i+1<u.live.length?'Next: '+u.live[i+1].code:'Go to mastery check'));}
function pcard(s,i,k,q){return qCard(q,{num:(k+1)+'.',maxTries:3,hints:true,regen:function(old){var nq=newQ(s.practice[k],q.prompt);st().prac[i][k]=nq;var nc=pcard(s,i,k,nq);old.replaceWith(nc);nc.classList.add('flash');var f=nc.querySelector('input,button.opt,select,button.chip');if(f)f.focus();}});}

// ---------- mastery ----------
function buildMastery(u){var out=[];u.live.forEach(function(s,si){var list=[],a=SHUF(s.m2),b=SHUF(s.m3);for(var k=0;k<u.per;k++){if(!a.length)a=SHUF(s.m2.length?s.m2:s.practiceAll);if(!b.length)b=SHUF(s.m3.length?s.m3:s.practiceAll);var g=(k%2===0?(a.shift()||b.shift()):(b.shift()||a.shift()));if(g)list.push(g);}
  uniq(list).forEach(function(q){q.std_i=si;out.push(q);});});return out;}
function renderMastery(m){var u=U(),x=st();if(!x.mastery){x.mastery=buildMastery(u);x.mres=x.mastery.map(function(){return null;});}
  m.insertAdjacentHTML('beforeend','<p class="secmeta">Mastery check · about '+x.mastery.length+' minutes</p><h1>Mastery check</h1><p>'+x.mastery.length+' questions, covering every standard at Level 2.0 and Level 3.0. <b>One try each, no hints.</b> The solution appears after you answer.</p>');
  var fin;x.mastery.forEach(function(q,i){var c=qCard(q,{num:(i+1)+'.',maxTries:1,hints:false,onDone:function(f,ok){x.mres[i]=ok;upd();}});
    var tag=document.createElement('span');tag.className='stdtag';tag.textContent=u.live[q.std_i].code;c.querySelector('.qhead').insertBefore(tag,c.querySelector('.tries'));
    if(x.mres[i]!==null){c.querySelector('.fb').className='fb muted';c.querySelector('.fb').textContent='Already answered: '+(x.mres[i]?'correct':'not correct')+'.';c.querySelectorAll('button,input,select').forEach(function(y){y.disabled=true;});}
    m.appendChild(c);});
  var d=nav(true,'See my results',function(){go(x.screen+1);});fin=d.lastChild;m.appendChild(d);
  function upd(){var left=x.mres.filter(function(y){return y===null;}).length;fin.disabled=left>0;fin.textContent=left>0?('Answer '+left+' more to see results'):'See my results';}upd();}

// ---------- results ----------
function renderResults(m){var u=U(),x=st();if(!x.mastery||x.mres.some(function(y){return y===null;})){go(screens(u).indexOf('mastery'));return;}
  var ok=x.mres.filter(Boolean).length,n=x.mres.length;var by=u.live.map(function(s){return {code:s.code,title:s.title,ok:0,n:0};});x.mastery.forEach(function(q,i){by[q.std_i].n++;if(x.mres[i])by[q.std_i].ok++;});
  S.R[u.i]={ok:ok,n:n,by:by};
  m.insertAdjacentHTML('beforeend','<p class="secmeta">Results</p><h1>Your results'+(S.name?', '+esc(S.name):'')+'</h1><div class="panel"><div class="score">'+ok+' / '+n+'</div><p class="muted">Mastery check · '+Math.round(100*ok/n)+'% · about '+mins()+(mins()===1?' minute':' minutes')+' in the app</p><div class="tw"><table><tr><th>Standard</th><th>Score</th><th>Status</th><th class="noprint"></th></tr>'+by.map(function(b,i){var solid=b.n&&b.ok/b.n>=0.75;return '<tr><td>'+b.title+' ('+b.code+')</td><td>'+b.ok+' / '+b.n+'</td><td><span class="tag '+(solid?'solid">Solid':'rev">Review')+'</span></td><td class="noprint"><button class="btn small" type="button" data-more="'+i+'">'+(solid?'Extra practice':'Practice more')+'</button></td></tr>';}).join('')+'</table></div><p class="muted" style="margin-top:.8em">Solid = at least 75% on that standard. Your results are not sent anywhere. Copy them or save them as a PDF to share with your teacher.</p></div>');
  var weak=by.filter(function(b){return !(b.n&&b.ok/b.n>=0.75);});var hon=[].concat.apply([],u.live.map(function(s){return s.honors;}));
  m.insertAdjacentHTML('beforeend','<div class="panel"><h2>Next steps</h2>'+(weak.length?'<p>Reread the Learn page and use <b>Practice more</b> for: '+weak.map(function(b){return b.title;}).join(', ')+'. Aim for a streak of 5.</p>':'<p>Every standard is solid.'+(hon.length?' Try the Honors challenge, or keep a streak going with extra practice.':' Keep a streak going with extra practice.')+'</p>')+
  '<div class="row noprint"><button class="btn primary" type="button" id="copyR">Copy my results</button><button class="btn" type="button" id="printR">Print / save as PDF</button><button class="btn" type="button" id="retake">Retake the mastery check</button>'+(hon.length?'<button class="btn" type="button" id="hon">Honors challenge (optional)</button>':'')+'<button class="btn" type="button" id="home2">All units</button></div><div class="fb" id="copyFb" aria-live="polite"></div></div>');
  m.querySelectorAll('[data-more]').forEach(function(b){b.onclick=function(){x.more={i:+b.dataset.more,streak:0,best:0,q:null};render();window.scrollTo(0,0);};});
  $('copyR').onclick=function(){copyText(oneText(u.i),$('copyFb'));};$('printR').onclick=function(){window.print();};
  $('retake').onclick=function(){x.mastery=null;x.mres=null;go(screens(u).indexOf('mastery'));};
  if(hon.length)$('hon').onclick=function(){x.honors={qs:hon.map(function(g){return newQ(g);})};render();window.scrollTo(0,0);};
  $('home2').onclick=goHome;
  var d=document.createElement('div');d.className='nav';var b=document.createElement('button');b.className='btn';b.type='button';b.textContent='Back to mastery check';b.onclick=function(){go(x.screen-1);};d.appendChild(b);m.appendChild(d);}
function mins(){return Math.max(1,Math.round((Date.now()-S.start)/60000));}
function head(){var d=new Date();return [C.title+' – Results','Name: '+(S.name||'(not entered)'),'Date: '+d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})];}
function lines(k){var u=UNITS[k],r=S.R[k];return ['Unit '+u.num+' '+u.name+' mastery check: '+r.ok+'/'+r.n+' ('+Math.round(100*r.ok/r.n)+'%)'].concat(r.by.map(function(b){return '   '+b.code+' '+b.title+': '+b.ok+'/'+b.n+' – '+(b.n&&b.ok/b.n>=0.75?'Solid':'Review');}));}
function oneText(k){return head().concat(lines(k)).concat(['Time in the app: about '+mins()+' minutes']).join('\n');}
function allText(){var L=head();Object.keys(S.R).forEach(function(k){L=L.concat(lines(k));});return L.concat(['Time in the app: about '+mins()+' minutes']).join('\n');}
function copyText(txt,fb){function ok(){fb.className='fb ok';fb.textContent='Copied. Paste it into a message to your teacher.';}
  function fallback(){var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var good=false;try{good=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);if(good)ok();else{fb.className='fb hint';fb.innerHTML='Copy this text by hand:<br><textarea rows="8" style="width:100%;margin-top:6px">'+esc(txt)+'</textarea>';}}
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,fallback);}else fallback();}catch(e){fallback();}}

// ---------- practice more / honors ----------
function renderMore(m){var x=st(),P=x.more,s=U().live[P.i];
  m.insertAdjacentHTML('beforeend','<p class="secmeta">'+s.code+' · Practice more</p><h1>Practice more: '+s.title+'</h1><div class="panel"><p class="streak">Streak: <span id="stk">'+P.streak+'</span> · Best: <span id="bst">'+P.best+'</span></p><p class="muted">New problems keep coming. A first-try correct answer without a hint adds to your streak; a miss resets it.</p></div>');

  next();

  var l=document.createElement('button');l.className='btn';l.type='button';l.textContent='Reread the Learn page';l.onclick=function(){go(screens(U()).indexOf('learn:'+P.i));};d.appendChild(b);d.appendChild(l);m.appendChild(d);}
function renderHonors(m){var x=st();m.insertAdjacentHTML('beforeend','<p class="secmeta">Optional</p><h1>Honors challenge</h1><p>Harder problems that stretch what you learned. Up to 3 tries, hints allowed.</p>');

  var d=document.createElement('div');d.className='nav';var b=document.createElement('button');b.className='btn';b.type='button';b.textContent='Back to results';b.onclick=function(){x.honors=null;render();window.scrollTo(0,0);};d.appendChild(b);m.appendChild(d);}

$('termsBtn').onclick=function(){var u=U();if(!u)return;var html='',seen=[];u.live.forEach(function(s){if(seen.indexOf(s.terms)>=0)return;seen.push(s.terms);html+='<h3 class="refh">'+s.code+' · '+s.title+'</h3><dl>'+s.terms.map(function(t){return '<dt>'+t[0]+'</dt><dd>'+t[1]+'</dd>';}).join('')+'</dl>';});$('termsBody').innerHTML=html;var dl=$('terms');if(dl.showModal)dl.showModal();else dl.setAttribute('open','');};

render();
