<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physics Review</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#F4F7FA;--surface:#FFFFFF;--ink:#17252E;--muted:#55666F;--line:#D2DCE0;
  --stain:#0F6B66;--stain-soft:#DDF0EE;--eosin:#A85A00;--eosin-soft:#FBEBD5;--accent:var(--eosin);--grid:rgba(15,107,102,.10);
  --ok:#2C7A4B;--ok-soft:#E1F1E7;--warn:#8F5B00;--warn-soft:#FAEFD8;--bad:#B0261E;--bad-soft:#FAE5E2;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1722;--surface:#15232C;--ink:#E4EDF1;--muted:#9CB0BA;--line:#2A3D48;
    --stain:#6ED0C6;--stain-soft:#123634;--eosin:#F2B45C;--eosin-soft:#3A2A12;--accent:var(--eosin);--grid:rgba(110,208,198,.07);
    --ok:#6FCB93;--ok-soft:#163323;--warn:#E6B65C;--warn-soft:#382B12;--bad:#F2908A;--bad-soft:#3C1C1A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1722;--surface:#15232C;--ink:#E4EDF1;--muted:#9CB0BA;--line:#2A3D48;
  --stain:#6ED0C6;--stain-soft:#123634;--eosin:#F2B45C;--eosin-soft:#3A2A12;--accent:var(--eosin);--grid:rgba(110,208,198,.07);
  --ok:#6FCB93;--ok-soft:#163323;--warn:#E6B65C;--warn-soft:#382B12;--bad:#F2908A;--bad-soft:#3C1C1A;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;min-height:100%;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.3px);background-size:18px 18px;color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .5em}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.15rem}
p{margin:0 0 .8em}
a{color:var(--stain)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin-right:auto}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--stain);background:transparent}
.dot.done{background:var(--stain)}
.dot.now{background:var(--eosin);border-color:var(--eosin)}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:.95rem}
.btn:hover{border-color:var(--stain)}
.btn.primary{background:var(--stain);border-color:var(--stain);color:var(--surface);font-weight:600}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:default}
main{max-width:820px;margin:0 auto;padding:22px 16px 40px}
.secmeta{color:var(--muted);font-size:.9rem;margin-bottom:.3em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px}
.lens{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.cellcard{position:relative;border:1.5px solid var(--stain);border-radius:10px;padding:16px 14px 16px 50px;background:var(--surface)}
.cellcard::before{content:"";position:absolute;left:16px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--eosin);box-shadow:8px 4px 0 var(--stain),2px 10px 0 var(--stain),10px 12px 0 var(--eosin)}

.cellcard b{display:block;font-family:var(--serif);font-size:1.05rem}
.cellcard span{font-size:.85rem;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-family:var(--serif);font-weight:600}
.tw{overflow-x:auto}
.miss{border-left:5px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:12px 16px;margin:12px 0}
.move{border-left:5px solid var(--eosin);background:var(--eosin-soft);border-radius:10px;padding:12px 16px;margin:12px 0}
.ex{border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin:10px 0}
.ex h3{font-size:1rem}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.chain span{background:var(--stain-soft);border:1px solid var(--stain);border-radius:999px;padding:3px 10px;font-size:.9rem}
.chain i{color:var(--muted);font-style:normal}
ul,ol{margin:0 0 .8em;padding-left:1.3em}
li{margin:.2em 0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 16px}
.qhead{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.qnum{font-family:var(--serif);font-weight:600}
.lvl{font-size:.78rem;border-radius:6px;padding:2px 7px;font-weight:600}
.lvl.l2{background:var(--stain-soft);color:var(--stain)}
.lvl.l3{background:var(--eosin-soft);color:var(--eosin)}
.tries{margin-left:auto;font-size:.82rem;color:var(--muted)}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px}
.opt.sel{border-color:var(--stain);background:var(--stain-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
input[type=text],input[type=number],select{font:inherit;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--bg);color:var(--ink);max-width:100%}
.ans{width:11em}
.unit{color:var(--muted)}
.cls{display:grid;gap:8px;margin:10px 0}
.clsrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.clsrow.right select{border-color:var(--ok)}.clsrow.wrong select{border-color:var(--bad)}
.ordbank,.ordpick{display:grid;gap:6px;margin:8px 0}
.ordpick{min-height:40px;border:1.5px dashed var(--line);border-radius:10px;padding:8px}
.ordpick ol{margin:0;padding-left:1.4em}
.chip{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:.95rem}
.fb{margin-top:10px;border-radius:10px;padding:9px 12px;font-size:.95rem}
.fb:empty{display:none}
.fb.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb.hint{background:var(--warn-soft);color:var(--ink)}
.sol{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.sol::before{content:"Worked solution";display:block;font-family:var(--serif);font-weight:600;margin-bottom:4px;color:var(--stain)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.score{font-family:var(--serif);font-size:2.6rem;line-height:1;margin:.1em 0}
.tag{font-size:.82rem;font-weight:700;border-radius:6px;padding:2px 8px}
.tag.solid{background:var(--ok-soft);color:var(--ok)}
.tag.rev{background:var(--warn-soft);color:var(--warn)}
.streak{font-family:var(--serif);font-size:1.3rem}
dialog{border:none;border-radius:16px;background:var(--surface);color:var(--ink);width:min(720px,94vw);max-height:86vh;padding:0}
dialog::backdrop{background:rgba(10,20,26,.55)}
.dhead{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.dbody{padding:12px 18px 18px}
.dbody dt{font-weight:700;margin-top:8px}.dbody dd{margin:0 0 4px 0}
.muted{color:var(--muted)}
.namebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
@media (max-width:560px){h1{font-size:1.6rem}.panel,.q{padding:14px}.brand{font-size:.95rem}}
@media (prefers-reduced-motion: no-preference){.q.flash{animation:fl .5s ease}@keyframes fl{from{box-shadow:0 0 0 4px var(--eosin-soft)}to{box-shadow:none}}}
@media print{
  header.top,.nav,.btn,dialog,.noprint{display:none!important}
  body{background:#fff;color:#000;font-size:12pt}
  .panel,.q{border:1px solid #999;break-inside:avoid}
  main{max-width:none;padding:0}
}

:root{--stain:#1E5AA0;--stain-soft:#E2ECF7;--eosin:#B4302A;--eosin-soft:#F8E4E2;--accent:var(--eosin);--grid:rgba(30,90,160,.08);}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stain:#8DB8EA;--stain-soft:#17304B;--eosin:#F08A80;--eosin-soft:#3D1E1C;--accent:var(--eosin);--grid:rgba(141,184,234,.06);}}:root[data-theme="dark"]{--stain:#8DB8EA;--stain-soft:#17304B;--eosin:#F08A80;--eosin-soft:#3D1E1C;--accent:var(--eosin);--grid:rgba(141,184,234,.06);}

.unit{margin:22px 0 8px}.unit h2{margin-bottom:.3em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px}
.scard{text-align:left;display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;position:relative;overflow:hidden}
.scard::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--stain)}
.scard:hover{border-color:var(--stain)}
.scard .code{font-family:var(--serif);font-weight:700;color:var(--stain);font-size:1.35rem;line-height:1}
.scard b{font-family:var(--serif);font-size:1.05rem}
.scard .goal{font-size:.86rem;color:var(--muted);line-height:1.4}
.scard .meta{font-size:.85rem;margin-top:auto}
.scard.soon{cursor:default;opacity:.6;border-style:dashed}.scard.soon::before{background:var(--line)}
.tag.none{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
:root{--tone3:#2E7D5B;--shadow:0 1px 2px rgba(20,30,40,.06),0 6px 18px rgba(20,30,40,.07)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tone3:#7FD3A9;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--tone3:#7FD3A9;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35)}
.hero{position:relative;overflow:hidden;background:var(--stain-soft);border:1px solid var(--line);border-radius:22px;padding:26px 26px 20px;margin:0 0 22px;box-shadow:var(--shadow)}
.hero h1{font-size:2.4rem;margin-bottom:.25em;position:relative}
.hero .secmeta,.hero .lede,.hero .stats,.hero .namebox{position:relative}
.hero .lede{max-width:34em;font-size:1.05rem}
.heroart{position:absolute;right:-20px;top:-10px;width:300px;opacity:.9}
.heroart .c1{fill:none;stroke:var(--stain);stroke-width:2.5;opacity:.35}
.heroart .c2{fill:var(--eosin);opacity:.45}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.stats span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem}
.stats b{font-family:var(--serif);color:var(--stain);font-size:1.05rem}
.ugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:0 0 22px}
.ucard{display:flex;gap:14px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.ucard:hover{transform:translateY(-2px);border-color:var(--stain)}
.ucard.soon{cursor:default;opacity:.6;box-shadow:none}
.unum{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:1.5rem;color:var(--surface);background:var(--stain)}
.tone1 .unum{background:var(--eosin)}.tone2 .unum{background:var(--tone3)}
.ubody{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ulabel{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ucard b{font-family:var(--serif);font-size:1.2rem;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip2{font-size:.78rem;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--stain-soft);color:var(--stain)}
.chip2.off{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.umeta{font-size:.85rem;color:var(--muted)}
.bar{display:block;height:6px;border-radius:99px;background:var(--line);overflow:hidden}.bar span{display:block;height:100%;background:var(--ok)}
.lens{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.cellcard{position:relative;text-align:left;font:inherit;color:var(--ink);border:2px solid var(--stain);border-radius:28px;padding:16px 14px 16px 44px;background:var(--stain-soft);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cellcard::before{content:"";position:absolute;left:14px;top:18px;width:18px;height:18px;border-radius:50%;background:var(--eosin);opacity:.8;box-shadow:none;transform:none}
.cellcard::after{display:none}
.cellcard b{display:block;font-family:var(--serif);font-size:1.05rem}
.cellcard span{font-size:.85rem;color:var(--muted)}
.cellcard .go{color:var(--stain);font-weight:600;margin-top:4px}
.cellcard:hover{box-shadow:var(--shadow)}
.cellcard.soon{cursor:default;opacity:.55;border-style:dashed}
.subh{font-size:1.5rem;margin-top:1.4em;padding-top:.6em;border-top:2px dashed var(--line)}
.stdtag{font-size:.75rem;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.refh{margin:14px 0 4px;color:var(--stain)}
@media (max-width:560px){.hero h1{font-size:1.8rem}.heroart{width:200px;right:-50px}}
@media print{.hero,.ugrid{display:none}}
</style>

<body>
<header class="top"><div class="topin"><div class="brand" id="brand">Physics Review</div><div class="dots" id="dots" aria-label="Progress"></div><button class="btn small" id="homeBtn" type="button">All units</button><button class="btn small" id="termsBtn" type="button">Reference sheet</button></div></header>
<main id="main"></main>
<dialog id="terms" aria-labelledby="termsTitle"><div class="dhead"><h2 id="termsTitle" style="margin:0;font-size:1.2rem">Reference sheet</h2><button class="btn small" id="termsClose" type="button">Close</button></div><div class="dbody" id="termsBody"></div></dialog>
<script>var GRADE=(function(){
  function lev(a,b){var m=a.length,n=b.length,d=[];for(var i=0;i<=m;i++){d[i]=[i];}for(var j=0;j<=n;j++)d[0][j]=j;
    for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
  function norm(s){return String(s).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/^\s*(the|a|an)\s+(?=\S)/,' ').replace(/\s+/g,' ').trim();}
  function parseNum(s){
    s=String(s).replace(/[\u2212\u2013\u2014]/g,'-').replace(/,/g,'').replace(/\s+/g,'');
    var sx=s.match(/^([-+]?(?:\d+\.?\d*|\.\d+))(?:x|×|\*)10\^?([-+]?\d+)/i);if(sx)return parseFloat(sx[1])*Math.pow(10,parseInt(sx[2],10));
    var m=s.match(/[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?/i);
    if(!m)return NaN; return parseFloat(m[0]);
  }
  // returns {ok, msg}
  function checkNum(input,ans,tol){
    var v=parseNum(input); if(isNaN(v))return {ok:false,blank:true,msg:'Type a number.'};
    tol=tol||0.02; var abs=ans!==0?Math.abs(ans)*tol:0.005;
    if(Math.abs(v-ans)<=abs)return {ok:true};
    if(ans!==0&&Math.abs(-v-ans)<=abs)return {ok:false,msg:'Right size, wrong sign. Check whether it went up (+) or down (−).'};
    if(Math.abs(v-ans)<=(ans!==0?Math.abs(ans)*0.08:0.01))return {ok:false,msg:'Very close. Check your rounding.'};
    return {ok:false,msg:'Not yet.'};
  }
  function checkAngle(input,ans){
    var v=parseNum(input); if(isNaN(v))return {ok:false,blank:true,msg:'Type an angle in degrees.'};
    function d(a,b){var x=((a-b)%360+540)%360-180;return Math.abs(x);}
    if(d(v,ans)<=1.0)return {ok:true};
    if(d(v+180,ans)<=1.0)return {ok:false,msg:'You are 180° off. Check the quadrant: are x and y positive or negative?'};
    if(d(-v,ans)<=1.0)return {ok:false,msg:'Right reference angle, wrong quadrant. Check the sign of y (up is +, down is −).'};
    if(d(180-v,ans)<=1.0)return {ok:false,msg:'Right reference angle, wrong quadrant. Check the sign of x (right is +, left is −).'};
    if(d(90-v,ans)<=1.0||d(v-90,ans)<=1.0&&d(v,ans)>5)return {ok:false,msg:'It looks like you measured from the y-axis. Measure counterclockwise from +x (east).'};
    if(d(v,ans)<=3.0)return {ok:false,msg:'Very close. Check your rounding.'};
    return {ok:false,msg:'Not yet.'};
  }
  function checkText(input,accept){
    var t=norm(input); if(!t)return {ok:false,blank:true,msg:'Type an answer.'};
    for(var i=0;i<accept.length;i++){var a=norm(accept[i]); if(t===a)return {ok:true};
      var lim=a.length>=9?2:(a.length>=5?1:0); if(lim&&lev(t,a)<=lim)return {ok:true,msg:'Accepted. Watch the spelling: '+accept[i]+'.'};}
    return {ok:false,msg:'Not yet.'};
  }
  return {parseNum:parseNum,checkNum:checkNum,checkAngle:checkAngle,checkText:checkText,norm:norm,lev:lev};
})();

</script>
<script>// Shared authoring helpers for review modules
window.L=(function(){
  function R(a,b){return a+Math.floor(Math.random()*(b-a+1));}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function r2(x){return Math.round(x*100)/100;}
  function f2(x){return String(r2(x));}
  function sgn(x){return x<0?'−'+f2(-x):f2(x);}
  // MC pool: each entry [prompt, answer, [distractors...], hint, solution]
  function MC(std,lvl,list){return function(){var v=pick(list);return {std:std,lvl:lvl,type:'mc',prompt:v[0],answer:v[1],options:[v[1]].concat(v[2]),hint:v[3],sol:v[4]};};}
  // typed term pool: each entry [definition prompt, [accepted forms], solution]
  function TXT(std,lvl,list,hint){return function(){var v=pick(list);return {std:std,lvl:lvl,type:'text',prompt:'Type the term: '+v[0],accept:v[1],hint:hint||'Use the vocabulary from your notes.',sol:v[2]||('<b>'+v[1][0].charAt(0).toUpperCase()+v[1][0].slice(1)+'</b>.')};};}
  // classify: items [[text,cat],...]; picks n with at least one of each category
  function CLS(std,lvl,prompt,cats,items,n,hint,sol){return function(){var chosen=[];cats.forEach(function(c){chosen.push(pick(items.filter(function(i){return i[1]===c;})));});var rest=shuffle(items.filter(function(i){return chosen.indexOf(i)<0;}));while(chosen.length<n&&rest.length)chosen.push(rest.pop());
    return {std:std,lvl:lvl,type:'classify',prompt:prompt,cats:cats,items:shuffle(chosen).map(function(i){return {t:i[0],c:i[1]};}),hint:hint,sol:sol};};}
  // order: list of sequences; each [prompt, [items in order], hint, sol]
  function ORD(std,lvl,list){return function(){var v=pick(list);return {std:std,lvl:lvl,type:'order',prompt:v[0],items:v[1].slice(),hint:v[2],sol:v[3]};};}
  function ANY(){var g=[].slice.call(arguments);return function(){return pick(g)();};}

  // ---------- Topic D: relative velocity ----------

    var veh=pick([{n:'train',v:[20,60]},{n:'ferry',v:[4,9]},{n:'airport shuttle bus',v:[5,15]},{n:'cruise ship',v:[6,12]}]),V=R(veh.v[0],veh.v[1]),p=R(1,4)+pick([0,0.5]),same=Math.random()<0.5;
    var ans=same?V+p:V-p;if(Math.abs(ans)<1)return d1();
    return {std:'D',lvl:'2.0',type:'num',prompt:'A '+veh.n+' moves <b>'+V+' m/s east</b> relative to the ground. A passenger walks <b>'+p+' m/s '+(same?'east':'west')+'</b> relative to the '+veh.n+'. What is the passenger’s velocity relative to the ground? (East is +.)',answer:ans,unit:'m/s',tol:0.02,
      hint:'Velocity relative to the ground = velocity of the '+veh.n+' + velocity of the passenger relative to the '+veh.n+'. Give west a negative sign.',
      sol:'v = '+V+' + ('+(same?'+':'−')+p+') = <b>'+ans+' m/s</b> (east).',params:{V:V,p:p,same:same}};}
  function d2(){ // what you see from your car
    var you=R(20,40)*1,other=R(10,45),opp=Math.random()<0.5;if(!opp&&other===you)other+=5;
    var ans=opp?-other-you:other-you;if(Math.abs(ans)<3)return d2();
    return {std:'D',lvl:'2.0',type:'num',prompt:'You drive <b>'+you+' mi/hr</b> forward relative to the road. Another vehicle is going <b>'+other+' mi/hr</b> '+(opp?'in the <b>opposite</b> direction':'in the <b>same</b> direction')+'. From your point of view, what is its velocity? (Your forward direction is +.)',answer:ans,unit:'mi/hr',tol:0.02,
      hint:'Velocity relative to you = its velocity − your velocity (both measured from the road). Opposite direction gets a negative sign.',
      sol:'v<sub>relative</sub> = ('+(opp?'−':'')+other+') − '+you+' = <b>'+si(ans)+' mi/hr</b>. '+(ans<0?'The negative sign means it moves backward past you.':'It slowly pulls ahead of you.'),params:{you:you,other:other,opp:opp}};}
  function d3(){ // moving walkway time
    var L=R(30,120),w=pick([0.8,1,1.2,1.5,2]),p=pick([1.2,1.4,1.5,2,2.5,3]),same=Math.random()<0.6;if(!same&&p<=w)p=w+1;
    var vg=same?p+w:p-w,t=L/vg;
    return {std:'D',lvl:'3.0',type:'num',prompt:'An airport moving walkway is <b>'+L+' m</b> long and moves at <b>'+w+' m/s</b>. You walk at <b>'+p+' m/s</b> relative to the walkway, '+(same?'<b>in the same direction</b> it moves':'<b>against</b> its motion')+'. How long does it take you to reach the other end?',answer:r2(t),unit:'s',tol:0.03,
      hint:'First find your speed relative to the ground ('+(same?'add':'subtract')+'), then t = distance ÷ speed.',
      sol:'Ground speed = '+p+' '+(same?'+':'−')+' '+w+' = '+f2(vg)+' m/s. t = '+L+' ÷ '+f2(vg)+' = <b>'+f2(t)+' s</b>.',params:{L:L,w:w,p:p,same:same}};}
  function d4(){ // river crossing, boat pointed straight across
    var b=R(3,9),c=R(1,6),W=R(4,20)*10,part=pick(['speed','time','drift']);
    var v=Math.sqrt(b*b+c*c),t=W/b,d=c*t,ans=part==='speed'?v:part==='time'?t:d;
    var Q={speed:'What is the boat’s speed relative to the ground?',time:'How long does it take to cross?',drift:'How far downstream does it land?'};
    var U={speed:'m/s',time:'s',drift:'m'};
    return {std:'D',lvl:'3.0',type:'num',prompt:'A boat points straight across a river (north) and moves <b>'+b+' m/s</b> relative to the water. The current flows <b>'+c+' m/s east</b>. The river is <b>'+W+' m</b> wide. '+Q[part],answer:r2(ans),unit:U[part],tol:0.03,
      hint:{speed:'The boat’s velocity and the current are perpendicular, so add them like components: √(v<sub>boat</sub>² + v<sub>current</sub>²).',time:'Only the part of the velocity that points across the river gets you across. The current does not help or hurt the crossing.',drift:'First find the crossing time using only the across-the-river speed. During that time the current carries you east.'}[part],
      sol:{speed:'v = √('+b+'² + '+c+'²) = <b>'+f2(v)+' m/s</b>.',time:'t = width ÷ across speed = '+W+' ÷ '+b+' = <b>'+f2(t)+' s</b>. The current does not change this.',drift:'t = '+W+' ÷ '+b+' = '+f2(t)+' s. Downstream distance = '+c+' × '+f2(t)+' = <b>'+f2(d)+' m</b>.'}[part],params:{b:b,c:c,W:W,part:part}};}
  function d5(){var v=pick([
    {prompt:'The current in a river speeds up from 2 m/s to 4 m/s. A boat still points straight across at the same speed. What happens to its crossing time?',answer:'It stays the same; only the downstream drift gets bigger.',options:['It stays the same; only the downstream drift gets bigger.','It doubles, because the current pushes harder.','It is cut in half.','The boat can no longer cross.'],hint:'Which component of the velocity gets the boat across?',sol:'Crossing time = width ÷ <b>across</b> speed. The current is perpendicular, so it does not change that component. It only carries the boat farther downstream.'},
    {prompt:'A walker and a rower go 1 km downstream and back. Both move 4 km/h (the rower relative to the water). The current is 2 km/h. Who finishes first?',answer:'The walker. The rower gains on the way down but loses more time on the way back.',options:['The walker. The rower gains on the way down but loses more time on the way back.','The rower, because the current helps on the way down.','They tie, because the current cancels out.','The rower, because boats are faster than walkers.'],hint:'Find each leg’s time: downstream 4 + 2, upstream 4 − 2.',sol:'Rower: 1/6 + 1/2 = 0.67 h. Walker: 1/4 + 1/4 = 0.5 h. The slow trip upstream costs more than the fast trip saves, so <b>the walker wins</b>.'},
    {prompt:'A receiver runs 8 m/s toward a ball thrown at 20 m/s toward him. How fast does the ball approach from the receiver’s point of view?',answer:'28 m/s',options:['28 m/s','12 m/s','20 m/s','8 m/s'],hint:'They are moving toward each other. Do the speeds add or subtract?',sol:'Moving toward each other, the speeds <b>add</b>: 20 + 8 = <b>28 m/s</b>.'},
    {prompt:'A truck drives 30 mi/hr to the left and fires a ball 30 mi/hr to the right from its back end. What does a person standing on the road see?',answer:'The ball drops almost straight down, with no sideways motion.',options:['The ball drops almost straight down, with no sideways motion.','The ball flies right at 60 mi/hr.','The ball flies left at 60 mi/hr.','The ball flies right at 30 mi/hr.'],hint:'Ground velocity = truck velocity + ball velocity relative to the truck.',sol:'−30 + 30 = <b>0 mi/hr</b> relative to the ground, so the ball just falls (the Mythbusters “vector vengeance” video).'},
    {prompt:'A plane heads north at 150 km/h through the air. A 40 km/h wind blows east. What does a person on the ground see?',answer:'The plane moves faster than 150 km/h, angled east of north.',options:['The plane moves faster than 150 km/h, angled east of north.','The plane moves exactly 150 km/h due north.','The plane moves 110 km/h north.','The plane moves 190 km/h due north.'],hint:'Perpendicular velocities combine like components.',sol:'Ground velocity = √(150² + 40²) ≈ 155 km/h, pointing a little <b>east of north</b>. A crosswind changes both speed and direction.'}
  ]);return {std:'D',lvl:'3.0',type:'mc',prompt:v.prompt,answer:v.answer,options:v.options,hint:v.hint,sol:v.sol};}
  function d6(){ // plane in crosswind: direction (mastery)
    var p=R(80,250),w=R(10,60),north=Math.random()<0.5,east=Math.random()<0.5;
    var x=north?(east?w:-w):p, y=north?p:(east?w:-w);
    var a=angleFrom(x,y);
    var heading=north?'north':'east',wind=north?(east?'east':'west'):(east?'north':'south');
    return {std:'D',lvl:'3.0',type:'num',angle:true,prompt:'A plane flies <b>'+p+' km/h '+heading+'</b> relative to the air. The wind blows <b>'+w+' km/h '+wind+'</b>. In what direction does the plane move relative to the ground (counterclockwise from +x)?',answer:r2(a),unit:'°',
      hint:'Put the plane and wind in components, add them, then find the angle with the reference angle and the quadrant.',
      sol:'v<sub>x</sub> = '+si(x)+' km/h, v<sub>y</sub> = '+si(y)+' km/h.<br>'+quadSteps(x,y)+' Answer: <b>'+deg(a)+'</b>.',params:{x:x,y:y}};}

  // ---------- Honors challenge ----------
  var honors=[
    function(){var b=R(6,12),c=R(2,b-2),W=R(5,20)*10,vy=Math.sqrt(b*b-c*c),t=W/vy;
      return {std:'D',lvl:'Honors',type:'num',prompt:'A boat moves <b>'+b+' m/s</b> relative to the water. The river flows <b>'+c+' m/s east</b> and is <b>'+W+' m</b> wide. The captain angles the boat upstream so it lands <b>directly across</b>. How long does the crossing take?',answer:r2(t),unit:'s',tol:0.03,
        hint:'To land straight across, the boat’s east–west part must cancel the current. The boat speed is the hypotenuse: v<sub>across</sub> = √(v<sub>boat</sub>² − v<sub>current</sub>²).',
        sol:'v<sub>across</sub> = √('+b+'² − '+c+'²) = '+f2(vy)+' m/s. t = '+W+' ÷ '+f2(vy)+' = <b>'+f2(t)+' s</b>. (Heading: '+deg(Math.asin(c/b)/D)+' west of north.)',params:{b:b,c:c,W:W}};},
    function(){var v=R(8,25),a=R(55,75),s=v/Math.tan(a*D);
      return {std:'D',lvl:'Honors',type:'num',prompt:'Rain falls straight down. From a bus moving <b>'+v+' m/s</b>, a passenger sees the rain streak at <b>'+a+'°</b> from vertical. How fast is the rain falling relative to the ground?',answer:r2(s),unit:'m/s',tol:0.03,
        hint:'Relative to the bus, the rain has a sideways part equal to the bus speed and a downward part equal to the real falling speed. tan(angle from vertical) = sideways ÷ downward.',
        sol:'tan('+a+'°) = '+v+' ÷ v<sub>rain</sub>, so v<sub>rain</sub> = '+v+' ÷ tan('+a+'°) = <b>'+f2(s)+' m/s</b>.',params:{v:v,a:a}};},
    function(){var A=R(20,80),Rm=R(40,120),t=R(15,75),rx=Rm*cosd(t),ry=Rm*sind(t),bx=rx-A,by=ry,M=Math.sqrt(bx*bx+by*by);
      return {std:'C',lvl:'Honors',type:'num',prompt:'What displacement must be added to <b>'+A+' cm in the +x direction</b> to give a resultant of <b>'+Rm+' cm @ '+t+'°</b>? Give its magnitude.',answer:r2(M),unit:'cm',tol:0.03,

        sol:'R = ('+f2(rx)+', '+f2(ry)+'). B = R − A = ('+f2(rx)+' − '+A+', '+f2(ry)+') = ('+f2(bx)+', '+f2(by)+'). |B| = <b>'+f2(M)+' cm</b> at '+deg(angleFrom(bx,by))+'.',params:{A:A,Rm:Rm,t:t}};}

var TERMS=[
 ['Vector','A quantity with a magnitude (size) and a direction. Drawn as an arrow: the length is the magnitude, the tip shows the direction. Examples: displacement, velocity, acceleration, force.'],
 ['Scalar','Magnitude only: distance, speed, time, mass.'],
 ['Angles','Measured counterclockwise from +x: east 0°, north 90°, west 180°, south 270° (or −90°). A negative angle turns clockwise.'],
 ['Compass directions','“θ° N of E” = start pointing east, turn θ toward north. N of E: θ · E of N: 90° − θ · N of W: 180° − θ · W of N: 90° + θ · S of W: 180° + θ · W of S: 270° − θ · S of E: 360° − θ (or −θ) · E of S: 270° + θ.'],
 ['SOH CAH TOA','sin θ = opposite ÷ hypotenuse · cos θ = adjacent ÷ hypotenuse · tan θ = opposite ÷ adjacent. Calculator in DEGREE mode.'],
 ['Components','A<sub>x</sub> = A cos θ · A<sub>y</sub> = A sin θ (θ from +x). The signs come out automatically.'],
 ['Magnitude from components','A = √(A<sub>x</sub>² + A<sub>y</sub>²)'],
 ['Direction from components','Reference angle = tan⁻¹(|A<sub>y</sub>| ÷ |A<sub>x</sub>|). Quadrant I: θ · II: 180° − θ · III: 180° + θ · IV: 360° − θ (or −θ).'],
 ['Adding graphically','Tail to tip. Make a legend (for example 1 cm = 1 m). The resultant goes from the tail of the first vector to the tip of the last.'],
 ['Negative vector','Same magnitude, flipped 180°. A − B = A + (−B).'],
 ['Adding mathematically','1) Break each vector into x and y. 2) Add all x’s → R<sub>x</sub>. 3) Add all y’s → R<sub>y</sub>. 4) R = √(R<sub>x</sub>² + R<sub>y</sub>²). 5) Angle with tan⁻¹ and the quadrant.'],
 ['Unit vectors','A = (A<sub>x</sub> x̂ + A<sub>y</sub> ŷ). Multiply and add each direction separately. (Some sheets write î and ĵ.)'],
 ['Relative velocity (1-D)','Same direction: add. Opposite: subtract (use + and −). Velocity relative to you = its velocity − your velocity.'],
 ['River crossing (pointed straight across)','v<sub>ground</sub> = √(v<sub>boat</sub>² + v<sub>current</sub>²) · t = width ÷ v<sub>boat</sub> · downstream = v<sub>current</sub> × t'],
 ['Distance, speed, time','d = v t · t = d ÷ v (use only the part of the velocity that points the way you are measuring)']
];
function termsHTML(){return '<dl>'+TERMS.map(function(t){return '<dt>'+t[0]+'</dt><dd>'+t[1]+'</dd>';}).join('')+'</dl>';}

var LEARN={
A:'<p class="secmeta">M1 · Vectors &amp; directions · Learn · about 4 minutes</p><h1>Vectors &amp; directions</h1>'+
'<div class="panel"><h2>What a vector is</h2><p>A <b>vector</b> has a <b>magnitude and a direction</b>. You already know three: displacement, velocity and acceleration. Draw a vector as an arrow: the length is the magnitude and the tip shows the direction. A <b>scalar</b> (distance, speed, time) has only a size.</p>'+SVG_AXES+
'<p><b>Angles</b> start at 0° pointing right (east) and grow <b>counterclockwise</b>: 90° up, 180° left, 270° down, 360° back to the start. A negative angle turns clockwise, so −20° is the same as 340°.</p>'+
'<p><b>Compass directions</b> read backward: start on the <i>second</i> direction and turn toward the <i>first</i>. “30° N of W” starts pointing west and turns 30° toward north, which is 150°.</p>'+
'<div class="tw"><table><tr><th>Compass form</th><th>Standard angle</th><th>Compass form</th><th>Standard angle</th></tr><tr><td>θ N of E</td><td>θ</td><td>θ S of W</td><td>180° + θ</td></tr><tr><td>θ E of N</td><td>90° − θ</td><td>θ W of S</td><td>270° − θ</td></tr><tr><td>θ N of W</td><td>180° − θ</td><td>θ S of E</td><td>360° − θ (or −θ)</td></tr><tr><td>θ W of N</td><td>90° + θ</td><td>θ E of S</td><td>270° + θ</td></tr></table></div></div>'+
'<div class="move"><h3>Thinking move: picture it before you calculate</h3><p>Sketch the axes, draw the arrow roughly, and say which quadrant it is in. Every later answer (signs of components, the final angle) gets checked against this sketch.</p></div>'+
'<div class="ex"><h3>Worked example 1: compass to degrees</h3><p><b>25 m @ 30° W of S.</b> Start pointing south (270°) and turn 30° toward west. Turning from south toward west goes clockwise, so subtract: 270° − 30° = <b>240°</b>. It is between 180° and 270°: <b>quadrant III</b>.</p></div>'+
'<div class="ex"><h3>Worked example 2: a negative vector</h3><p>A = 12 m @ 50°. To get −A, keep the length and flip it 180°: −A = <b>12 m @ 230°</b>. Never write a negative magnitude.</p></div>'+
'<div class="ex"><h3>Worked example 3: drawing with a legend</h3><p>With a legend of 1 cm = 10 m, a 35 m vector is drawn 3.5 cm long. If your resultant arrow measures 6.2 cm, it represents 62 m.</p></div>'+
'<div class="miss"><h3>Ideas students usually miss</h3><ul><li>0° is east (right), not north. (The Vectors of Flight lab used bearings from north; this review uses the notes’ method from +x.)</li><li>“N of W” and “W of N” are different directions.</li><li>−A means flipped 180°, not a negative length.</li><li>Displacement can be 0 even after you walk a long way.</li></ul></div>',

B:'<p class="secmeta">M1 · Components · Learn · about 4 minutes</p><h1>Components</h1>'+
'<div class="panel"><h2>Breaking a vector into x and y</h2><p>Every vector is the hypotenuse of a right triangle. Its <b>components</b> are the two legs: how far it goes in x and how far in y.</p>'+SVG_COMP+
'<p><b>A<sub>x</sub> = A cos θ</b> and <b>A<sub>y</sub> = A sin θ</b>, with θ measured counterclockwise from +x. Use the standard angle and the signs come out right on their own. (SOH CAH TOA: cosine uses the adjacent side, sine the opposite side.) Calculator in <b>degree</b> mode.</p>'+
'<p><b>Back to one vector:</b> magnitude A = √(A<sub>x</sub>² + A<sub>y</sub>²). For the direction, find the <b>reference angle</b> tan⁻¹(|A<sub>y</sub>| ÷ |A<sub>x</sub>|), then use the signs to place it.</p>'+
'<div class="tw"><table><tr><th>Signs</th><th>Quadrant</th><th>Angle from +x</th></tr><tr><td>x +, y +</td><td>I</td><td>θ</td></tr><tr><td>x −, y +</td><td>II</td><td>180° − θ</td></tr><tr><td>x −, y −</td><td>III</td><td>180° + θ</td></tr><tr><td>x +, y −</td><td>IV</td><td>360° − θ (or −θ)</td></tr></table></div></div>'+
'<div class="move"><h3>Thinking move: let the signs check you</h3><p>Before trusting a calculator angle, look at the signs of x and y. tan⁻¹ only ever gives an angle between −90° and 90°, so for vectors pointing left you must fix the quadrant yourself.</p></div>'+
'<div class="ex"><h3>Worked example 1: magnitude and angle to components</h3><p>A = 40 m @ 140°. A<sub>x</sub> = 40 cos 140° = <b>−30.64 m</b>. A<sub>y</sub> = 40 sin 140° = <b>25.71 m</b>. Check: 140° is in quadrant II, so x should be negative and y positive. ✓</p></div>'+
'<div class="ex"><h3>Worked example 2: components to magnitude and angle</h3><p>A<sub>x</sub> = −9 m, A<sub>y</sub> = −12 m. A = √(81 + 144) = <b>15 m</b>. Reference angle = tan⁻¹(12 ÷ 9) = 53.13°. Both negative → quadrant III → 180° + 53.13° = <b>233.13°</b> (that is 53.13° S of W).</p></div>'+
'<div class="ex"><h3>Worked example 3: using one component</h3><p>A bird flies 15 m/s @ 40° N of E. How long to get 60 m north? Only the north part matters: v<sub>y</sub> = 15 sin 40° = 9.64 m/s. t = 60 ÷ 9.64 = <b>6.22 s</b>.</p></div>'+
'<div class="miss"><h3>Ideas students usually miss</h3><ul><li>Calculator in radian mode gives nonsense. Use degrees.</li><li>If the angle is measured from the y-axis (like “E of N”), convert it first or swap sin and cos.</li><li>tan⁻¹ of a negative ratio gives a negative angle that may be in the wrong quadrant. Use the reference-angle table.</li><li>A magnitude is never negative; components can be.</li></ul></div>',

C:'<p class="secmeta">M1 · Adding &amp; subtracting · Learn · about 4 minutes</p><h1>Adding &amp; subtracting vectors</h1>'+
'<div class="panel"><h2>Two ways, same answer</h2><p><b>Graphically:</b> draw the vectors <b>tail to tip</b> with a ruler, protractor and legend. The resultant goes from the tail of the first to the tip of the last. To subtract, flip that vector 180° and add it.</p>'+
'<p><b>Mathematically (the five steps from the notes):</b></p><ol><li>Break each vector into x and y components.</li><li>Add all the x-components → R<sub>x</sub>.</li><li>Add all the y-components → R<sub>y</sub>.</li><li>Use the Pythagorean theorem: R = √(R<sub>x</sub>² + R<sub>y</sub>²).</li><li>Use inverse tan for the reference angle, then place it in the right quadrant.</li></ol>'+
'<p><b>Unit vectors</b> are vectors already written as components: A = (3x̂ + 4ŷ) m. To find 2A − B, work x̂ and ŷ separately.</p></div>'+
'<div class="move"><h3>Thinking move: organize, then add</h3><p>Make a small table with one row per vector and columns for x and y. Subtracting a vector means changing the signs of both of its components. When you finish, compare your answer to a quick sketch: does the resultant point roughly where the drawing says?</p></div>'+
'<div class="ex"><h3>Worked example 1: a three-leg walk</h3><p>30 m north, then 20 m west, then 25 m @ 35° S of W (that is 215°).</p><div class="tw"><table><tr><th>Leg</th><th>x (m)</th><th>y (m)</th></tr><tr><td>30 m @ 90°</td><td>0</td><td>30</td></tr><tr><td>20 m @ 180°</td><td>−20</td><td>0</td></tr><tr><td>25 m @ 215°</td><td>−20.48</td><td>−14.34</td></tr><tr><td><b>Total</b></td><td><b>−40.48</b></td><td><b>15.66</b></td></tr></table></div><p>R = √(40.48² + 15.66²) = <b>43.40 m</b>. Reference angle = tan⁻¹(15.66 ÷ 40.48) = 21.15°. x −, y + → quadrant II → 180° − 21.15° = <b>158.85°</b> (21.15° N of W).</p></div>'+
'<div class="ex"><h3>Worked example 2: unit vectors</h3><p>A = (3x̂ + 4ŷ) m, B = (−5x̂ + 2ŷ) m. 2A − B: x̂: 2(3) − (−5) = 11; ŷ: 2(4) − 2 = 6. So 2A − B = <b>(11x̂ + 6ŷ) m</b>, magnitude √(121 + 36) = 12.53 m at tan⁻¹(6 ÷ 11) = 28.61°.</p></div>'+
'<div class="miss"><h3>Ideas students usually miss</h3><ul><li>You cannot add magnitudes (30 + 20 + 25) unless the vectors point the same way.</li><li>Subtracting B flips <b>both</b> of its components.</li><li>Order does not matter when adding; the resultant is the same.</li><li>Keep 2 decimals in the middle steps so rounding does not pile up.</li></ul></div>',

D:'<p class="secmeta">M1 · Relative velocity · Learn · about 4 minutes</p><h1>Relative velocity</h1>'+
'<div class="panel"><h2>Motion depends on who is watching</h2><p>Your frame of reference changes the velocity you see. The rule: <b>velocity relative to the ground = velocity of the object relative to the moving thing + velocity of the moving thing relative to the ground.</b></p>'+
'<p><b>In one dimension</b>, pick a positive direction. Same direction: add. Opposite direction: subtract. To see something from another moving object’s view: <b>its velocity − your velocity</b>.</p>'+
'<p><b>In two dimensions</b> (boat and current, plane and wind), the velocities are vectors, so add them with components.</p>'+SVG_RIVER+
'<p>Boat pointed <b>straight across</b>: v<sub>ground</sub> = √(v<sub>boat</sub>² + v<sub>current</sub>²). Crossing time = width ÷ v<sub>boat</sub>. Downstream drift = v<sub>current</sub> × time.</p></div>'+
'<div class="move"><h3>Thinking move: split the motion</h3><p>Ask which part of the velocity does the job. Only the across-the-river part gets you across; only the current carries you downstream. Write each part with its own distance and time.</p></div>'+
'<div class="ex"><h3>Worked example 1: walking on a train</h3><p>A train goes 25 m/s east. You walk 2 m/s west inside it. Relative to the ground: 25 + (−2) = <b>23 m/s east</b>.</p></div>'+
'<div class="ex"><h3>Worked example 2: from your car</h3><p>You drive 30 mi/hr. A truck in the other lane goes 35 mi/hr the opposite way. From your view: (−35) − 30 = <b>−65 mi/hr</b>; it rushes backward past you.</p></div>'+
'<div class="ex"><h3>Worked example 3: a river crossing</h3><p>A boat points across at 5 m/s; the current is 2 m/s; the river is 60 m wide. Ground speed = √(25 + 4) = <b>5.39 m/s</b> at tan⁻¹(2 ÷ 5) = 21.8° downstream of straight across. Time = 60 ÷ 5 = <b>12 s</b>. Drift = 2 × 12 = <b>24 m</b> downstream.</p></div>'+
'<div class="miss"><h3>Ideas students usually miss</h3><ul><li>The current does not change the crossing time when you point straight across.</li><li>For time across, divide by the boat’s speed, not the combined speed.</li><li>Use signs: a headwind or walking backward subtracts.</li><li>Going downstream and back with a current takes longer than with no current.</li></ul></div>'
};

window.REG.physG1=L.MOD('G1','Universal gravitation',TERMS,null,[{id:'U1',name:'Universal gravitation',learn:L.learn('G1','Universal gravitation',5,'<p><b>Newton’s law of universal gravitation</b>: every mass attracts every other mass:</p><p style="text-align:center"><b>F<sub>g</sub> = Gm<sub>1</sub>m<sub>2</sub> ÷ r²</b>, G = 6.67 × 10⁻¹¹ N·m²/kg²</p><p>r is measured <b>center to center</b>. It is an <b>inverse-square</b> law: double the distance → ¼ the force; double one mass → double the force. The field strength (acceleration due to gravity) at distance r from a planet is <b>g = GM ÷ r²</b>; your own mass doesn’t change it.</p>',['use ratios','<p>“Moving from R to 2R from Earth’s center makes r² four times bigger, so g drops to 9.8 ÷ 4 = 2.45 m/s².”</p>'],[['Worked example 1','70 kg student at sea level: F = (6.67 × 10⁻¹¹)(5.98 × 10²⁴)(70) ÷ (6.38 × 10⁶)² = 686 N (= mg).'],['Worked example 2','On an airplane 11,887 m up: r = 6.392 × 10⁶ m, g = 9.76 m/s², barely less.'],['Worked example 3','Halving the distance: force × 4. Tripling it: force ÷ 9.']],['Add the altitude to Earth’s radius.','Gravity never “turns off” in orbit.','Mass of the falling object doesn’t change g.']),practice:[grav,grav,grav,g1c,g1c],mastery:[grav,grav,g1c]}]);
window.REG.physG2=L.MOD('G2','Circular motion & orbits',TERMS,null,[
 {id:'U2',name:'Uniform circular motion',learn:L.learn('G2','Uniform circular motion',5,'<p><b>Uniform circular motion</b>: constant speed around a circle. Velocity is <b>tangent</b> to the circle and keeps changing direction, so the object <b>accelerates toward the center</b>.</p>'+T(['Quantity','Equation'],[['Speed','v = 2πr ÷ T'],['Centripetal acceleration','a<sub>c</sub> = v² ÷ r (toward the center)'],['Centripetal force','F<sub>c</sub> = mv² ÷ r']])+'<p>The centripetal force is not a new force: it is supplied by friction (car on a curve), tension (ball on a string), gravity (orbits) or the normal force (loops, hills). Steps: FBD → which forces point to the center → ΣF<sub>toward center</sub> = mv²/r.</p>',['name what supplies F<sub>c</sub>','<p>“On a flat curve, only friction points to the center, so μ<sub>s</sub>mg = mv²/r and v<sub>max</sub> = √(μ<sub>s</sub>gr).”</p>'],[['Worked example 1','Ball on a 0.93 m string, 1.18 s per revolution: v = 4.95 m/s; F<sub>c</sub> = 0.013(4.95²) ÷ 0.93 = 0.343 N (tension).'],['Worked example 2','1200 kg car, r = 45 m, μ<sub>s</sub> = 0.82: v<sub>max</sub> = √(0.82 × 9.8 × 45) = 19.0 m/s.'],['Worked example 3','720 kg car over a 70 m hill at 12 m/s: N = 720(9.8 − 2.06) = 5,575 N.']],['There’s no outward force; inertia keeps objects going straight.','At the top of a loop, gravity points toward the center.','Square the speed.']),practice:[speed,ac,ac,curve,vert,g2c],mastery:[ac,curve,vert,g2c]},
 {id:'U3',name:'Orbits & Kepler’s laws',learn:L.learn('G2','Orbits & Kepler’s laws',4,'<p>For a satellite, gravity <b>is</b> the centripetal force: GMm/r² = mv²/r, so <b>v = √(GM ÷ r)</b> and <b>T = 2πr ÷ v</b>. The satellite’s own mass cancels.</p><p><b>Kepler’s laws</b>: (1) orbits are ellipses with the Sun at one focus; (2) a planet sweeps out equal areas in equal times, so it moves faster when closer to the Sun; (3) farther planets have longer periods (T² ∝ r³).</p>',['gravity provides the center-seeking force','<p>“A higher orbit means larger r, so gravity is weaker and the orbit speed is smaller, and the period is longer.”</p>'],[['Worked example 1','500 kg satellite 225 km up: r = 6.605 × 10⁶ m; v = √(GM/r) = 7,760 m/s; T = 5,350 s ≈ 1.49 h.'],['Worked example 2','Earth around the Sun: T = 1 year = 3.16 × 10⁷ s; v = 2π(1.5 × 10¹¹) ÷ T ≈ 29,800 m/s.'],['Worked example 3','A geostationary orbit (35,786 km up) has a 24-hour period, so it stays over one spot.']],['Orbit speed doesn’t depend on the satellite’s mass.','Use r from the center of the planet.','Faster near the Sun, slower far away (Kepler 2).']),practice:[kep,orbit,orbit,g2c],mastery:[kep,orbit]}]);

(function(){var R=L.R,pick=L.pick,MC=L.MC,CLS=L.CLS,T=L.table;
function s3(x){return Number(x.toPrecision(3));}var g=9.8;
var kepe=function(){var k=pick(['ke','pe','me']);var m=pick([0.86,2,22,75,1000]),v=pick([3,6.5,10,15,36]),h=pick([2.5,6,13.3,30,100]);
  if(k==='ke')return {std:'ECV1',lvl:'2.0',type:'num',prompt:'What is the kinetic energy of a <b>'+m+' kg</b> object moving at <b>'+v+' m/s</b>?',answer:0.5*m*v*v,unit:'J',tol:0.02,hint:'KE = ½mv².',sol:'KE = ½('+m+')('+v+')² = <b>'+s3(0.5*m*v*v)+' J</b>.',params:{m:m,v:v,k:k}};
  if(k==='pe')return {std:'ECV1',lvl:'2.0',type:'num',prompt:'What is the gravitational potential energy of a <b>'+m+' kg</b> object <b>'+h+' m</b> above the reference level?',answer:m*g*h,unit:'J',tol:0.02,hint:'PE = mgh.',sol:'PE = ('+m+')(9.8)('+h+') = <b>'+s3(m*g*h)+' J</b>.',params:{m:m,h:h,k:k}};
  return {std:'ECV1',lvl:'2.0',type:'num',prompt:'A <b>'+m+' kg</b> roller coaster car moves at <b>'+v+' m/s</b> at a height of <b>'+h+' m</b>. What is its total mechanical energy?',answer:0.5*m*v*v+m*g*h,unit:'J',tol:0.02,hint:'ME = KE + PE.',sol:'KE = '+s3(0.5*m*v*v)+' J; PE = '+s3(m*g*h)+' J; ME = <b>'+s3(0.5*m*v*v+m*g*h)+' J</b>.',params:{m:m,v:v,h:h,k:k}};};
var cons=function(){var k=pick(['fall','coaster','up','limb']);
  if(k==='fall'){var h=R(3,60);return {std:'ECV1',lvl:'3.0',type:'num',prompt:'A rock falls from rest from <b>'+h+' m</b>. Using conservation of energy, how fast is it moving just before it hits the ground?',answer:Math.sqrt(2*g*h),unit:'m/s',tol:0.02,hint:'mgh = ½mv² → v = √(2gh). Mass cancels.',sol:'v = √(2 × 9.8 × '+h+') = <b>'+s3(Math.sqrt(2*g*h))+' m/s</b>.',params:{h:h,k:k}};}
  if(k==='coaster'){var vi=pick([5,10,12]),h1=pick([60,80,100]),h2=pick([0,20,30,45]);var vf=Math.sqrt(vi*vi+2*g*(h1-h2));return {std:'ECV1',lvl:'3.0',type:'num',prompt:'A frictionless roller coaster moves at <b>'+vi+' m/s</b> at a height of <b>'+h1+' m</b>. How fast is it moving at a point <b>'+h2+' m</b> high?',answer:vf,unit:'m/s',tol:0.02,hint:'½mv<sub>i</sub>² + mgh<sub>i</sub> = ½mv<sub>f</sub>² + mgh<sub>f</sub>. Mass cancels.',sol:'v<sub>f</sub> = √('+vi+'² + 2(9.8)('+h1+' − '+h2+')) = <b>'+s3(vf)+' m/s</b>.',params:{vi:vi,h1:h1,h2:h2,k:k}};}
  if(k==='up'){var v0=pick([25,30,36]),dh=pick([5,7.2,10]);var vc=Math.sqrt(v0*v0-2*g*dh);return {std:'ECV1',lvl:'3.0',type:'num',prompt:'A baseball leaves the bat at <b>'+v0+' m/s</b> and is caught <b>'+dh+' m</b> higher than where it was hit. Ignoring air resistance, how fast is it moving when caught?',answer:vc,unit:'m/s',tol:0.02,hint:'Some KE became PE: ½v<sub>i</sub>² = ½v<sub>f</sub>² + gΔh.',sol:'v<sub>f</sub> = √('+v0+'² − 2(9.8)('+dh+')) = <b>'+s3(vc)+' m/s</b>.',params:{v0:v0,dh:dh,k:k}};}
  var m=pick([10,22]),h1b=pick([13.3,15,20]),h2b=pick([4,6]);var KE=m*g*(h1b-h2b);return {std:'ECV1',lvl:'3.0',type:'num',prompt:'A <b>'+m+' kg</b> tree limb falls from <b>'+h1b+' m</b> onto a roof <b>'+h2b+' m</b> above the ground. What is its kinetic energy when it hits the roof?',answer:KE,unit:'J',tol:0.02,hint:'KE gained = PE lost = mg(h<sub>1</sub> − h<sub>2</sub>).',sol:'KE = ('+m+')(9.8)('+h1b+' − '+h2b+') = <b>'+s3(KE)+' J</b>.',params:{m:m,h1:h1b,h2:h2b,k:k}};};
var spring=function(){var k=pick(['k','pe','v']);
  if(k==='k'){var F=pick([60,120,200]),x=pick([0.015,0.0225,0.04]);return {std:'ECV1',lvl:'2.0',type:'num',prompt:'A force of <b>'+F+' N</b> stretches a spring <b>'+x+' m</b>. What is the spring constant?',answer:F/x,unit:'N/m',tol:0.02,hint:'Hooke’s law: F = kx.',sol:'k = '+F+' ÷ '+x+' = <b>'+s3(F/x)+' N/m</b>.',params:{F:F,x:x,k:k}};}

  var m=pick([0.75,1.7,2]);return {std:'ECV1',lvl:'3.0',type:'num',prompt:'A spring (k = <b>'+kk+' N/m</b>) compressed <b>'+x2+' m</b> launches a <b>'+m+' kg</b> block across a frictionless floor. How fast is the block moving when it leaves the spring?',answer:Math.sqrt(kk*x2*x2/m),unit:'m/s',tol:0.02,hint:'½kx² = ½mv² → v = x√(k ÷ m).',sol:'PE<sub>s</sub> = '+s3(PE)+' J = ½('+m+')v² → v = <b>'+s3(Math.sqrt(kk*x2*x2/m))+' m/s</b>.',params:{k:kk,x:x2,m:m}};};
var work=function(){var k=pick(['W','ang','wet','grav']);
  if(k==='W'){var F=pick([4.5,25,90,120]),d=pick([0.15,2,5,30]);return {std:'ECV1',lvl:'2.0',type:'num',prompt:'A <b>'+F+' N</b> force pushes an object <b>'+d+' m</b> in the direction of the force. How much work is done?',answer:F*d,unit:'J',tol:0.02,hint:'W = Fd cos θ; here θ = 0°.',sol:'W = ('+F+')('+d+') = <b>'+s3(F*d)+' J</b>.',params:{F:F,d:d,k:k}};}
  if(k==='ang'){var F2=pick([11,45,255]),d2=pick([2,10,30]),th=pick([25,29,40]);var W=F2*d2*Math.cos(th*Math.PI/180);return {std:'ECV1',lvl:'3.0',type:'num',prompt:'A sailor pulls a boat <b>'+d2+' m</b> along a dock with a rope at <b>'+th+'°</b> above the horizontal and a force of <b>'+F2+' N</b>. How much work does the sailor do?',answer:W,unit:'J',tol:0.02,hint:'Only the part of the force along the motion does work: W = Fd cos θ.',sol:'W = ('+F2+')('+d2+') cos '+th+'° = <b>'+s3(W)+' J</b>.',params:{F:F2,d:d2,th:th,k:k}};}
  if(k==='grav'){var m=pick([75,10,1.3]),h=pick([2.5,3,5]);return {std:'ECV1',lvl:'2.0',type:'num',prompt:'A <b>'+m+' kg</b> person goes down a water slide, dropping a vertical height of <b>'+h+' m</b>. How much work does gravity do?',answer:m*g*h,unit:'J',tol:0.02,hint:'Gravity’s work depends only on the vertical drop: W = mgh (positive going down).',sol:'W = ('+m+')(9.8)('+h+') = <b>'+s3(m*g*h)+' J</b>.',params:{m:m,h:h,k:k}};}
  var m2=pick([0.105,2,40]),F3=pick([4.5,10,30]),d3=pick([0.15,2,5]),vi=pick([0,0.5,2]);var vf=Math.sqrt(vi*vi+2*F3*d3/m2);return {std:'ECV1',lvl:'3.0',type:'num',prompt:'A net force of <b>'+F3+' N</b> acts on a <b>'+m2+' kg</b> object over <b>'+d3+' m</b>. It starts at <b>'+vi+' m/s</b>. Use the work-energy theorem to find its final speed.',answer:vf,unit:'m/s',tol:0.02,hint:'W<sub>net</sub> = ΔKE = ½mv<sub>f</sub>² − ½mv<sub>i</sub>².',sol:'W = '+s3(F3*d3)+' J; ½('+m2+')v<sub>f</sub>² = '+s3(F3*d3+0.5*m2*vi*vi)+' J → v<sub>f</sub> = <b>'+s3(vf)+' m/s</b>.',params:{m:m2,F:F3,d:d3,vi:vi,k:k}};};
var power=function(){var k=pick(['P','hp','car']);
  if(k==='P'){var F=pick([150,1200,12000]),d=pick([3,9,12]),t=pick([2,10,15]);return {std:'ECV1',lvl:'2.0',type:'num',prompt:'A motor lifts an elevator <b>'+d+' m</b> in <b>'+t+' s</b> with an upward force of <b>'+F+' N</b>. What power does it produce?',answer:F*d/t,unit:'W',tol:0.02,hint:'P = W ÷ t = Fd ÷ t.',sol:'P = ('+F+')('+d+') ÷ '+t+' = <b>'+s3(F*d/t)+' W</b>.',params:{F:F,d:d,t:t,k:k}};}
  if(k==='hp'){var W=pick([3000,7200,15000]);var t2=pick([4,5,10]);return {std:'ECV1',lvl:'2.0',type:'num',prompt:'A machine does <b>'+W+' J</b> of work in <b>'+t2+' s</b>. What is its power in horsepower? (1 hp = 746 W)',answer:W/t2/746,unit:'hp',tol:0.02,hint:'P = W ÷ t, then ÷ 746.',sol:'P = '+s3(W/t2)+' W = <b>'+s3(W/t2/746)+' hp</b>.',params:{W:W,t:t2,k:k}};}
  var m=pick([1300,1500]),v1=pick([13.4,15]),v2=pick([17.9,20]),t=pick([3,4]);var P=0.5*m*(v2*v2-v1*v1)/t;return {std:'ECV1',lvl:'3.0',type:'num',prompt:'A <b>'+m+' kg</b> car speeds up from <b>'+v1+' m/s</b> to <b>'+v2+' m/s</b> in <b>'+t+' s</b>. What average power is needed (ignore friction)?',answer:P,unit:'W',tol:0.02,hint:'Work = ΔKE; P = ΔKE ÷ t.',sol:'ΔKE = ½('+m+')('+v2+'² − '+v1+'²) = '+s3(P*t)+' J; P = <b>'+s3(P)+' W</b>.',params:{m:m,v1:v1,v2:v2,t:t}};};
var nc=function(){var m=pick([0.017,0.5,95]),h=pick([3,5.3,10]),v=pick([1.3,4,6]);if(v*v/2>g*h)v=1.3;var Wnc=0.5*m*v*v-m*g*h;return {std:'ECV1',lvl:'3.0',type:'num',prompt:'A <b>'+m+' kg</b> object falls from rest from <b>'+h+' m</b> and lands at <b>'+v+' m/s</b>. How much non-conservative work (air resistance) was done on it? Include the sign.',answer:Wnc,unit:'J',tol:0.03,hint:'W<sub>nc</sub> = ΔME = (KE<sub>f</sub> + PE<sub>f</sub>) − (KE<sub>i</sub> + PE<sub>i</sub>).',sol:'W<sub>nc</sub> = ½('+m+')('+v+')² − ('+m+')(9.8)('+h+') = <b>'+s3(Wnc)+' J</b> (negative: energy taken out by air resistance).',params:{m:m,h:h,v:v}};};
var wsign=CLS('ECV1','2.0','Is the work done by the named force positive, negative or zero?',['Positive work','Negative work','Zero work'],[['Gravity on a book falling to the floor','Positive work'],['A rocket’s thrust as it accelerates upward','Positive work'],['Friction on a sliding box','Negative work'],['Gravity on a ball thrown upward (while rising)','Negative work'],['A teacher pushing hard on a wall that doesn’t move','Zero work'],['A waiter’s upward force on a tray carried across the room at constant speed','Zero work'],['The normal force on a box sliding across a floor','Zero work']],5,'Work = Fd cos θ: force along motion (+), against motion (−), perpendicular or no motion (0).','Positive when the force has a part along the motion; negative when opposite; zero when perpendicular or there is no displacement.');

 ['On a frictionless track, where does an object have the most kinetic energy?','At the lowest point, where the most potential energy has been converted to kinetic energy.',['At the highest point.','Everywhere equally.','Where it stops.'],'ME = KE + PE is constant.','Lowest PE ↔ highest KE.'],
 ['A person lifts a box onto a truck, or pushes it up a frictionless ramp to the same height. Which takes less work?','Both take the same work; the ramp needs less force over a longer distance.',['Lifting straight up','The ramp','Impossible to know'],'Work = change in PE here.','Same Δh → same ΔPE → <b>same work</b>.'],

window.REG.physECV1=L.MOD('ECV1','Energy conversion',TERMS,null,[
 {id:'W1',name:'KE, PE & conservation of energy',learn:L.learn('ECV1','KE, PE & conservation of energy',5,'<p><b>Energy</b> is the ability to do work (J). Mechanical energy has two major types: <b>kinetic</b> (KE = ½mv²) and <b>potential</b> (gravitational PE = mgh; elastic PE = ½kx²).</p><p><b>Law of conservation of energy</b>: energy can’t be created or destroyed, only transformed. With no friction: <b>KE<sub>i</sub> + PE<sub>i</sub> = KE<sub>f</sub> + PE<sub>f</sub></b>. Mass often cancels.</p>',['bar-graph the energy','<p>“At the top: all PE. Halfway down: half PE, half KE. At the bottom: all KE.” Sketch bars before you calculate.</p>'],[['Worked example 1','22 kg limb falls from 13.3 m to a 6 m roof: KE = (22)(9.8)(7.3) = 1,574 J; v = √(2 × 9.8 × 7.3) = 12.0 m/s.'],['Worked example 2','Frictionless coaster at 10 m/s, 100 m high, reaches ground level: v = √(100 + 1,960) = 45.4 m/s.'],['Worked example 3','Baseball at 36 m/s caught 7.2 m higher: v = √(1,296 − 141) = 34.0 m/s.']],['Total mechanical energy stays constant without friction.','Pick one reference level for PE and keep it.','Speed doesn’t depend on mass in these problems.']),practice:[kepe,kepe,cons,cons,e3],mastery:[kepe,cons,e3]},
 {id:'W2',name:'Springs & elastic energy',learn:L.learn('ECV1','Springs & elastic energy',4,'<p><b>Hooke’s law</b>: F = kx (k = spring constant in N/m; x = stretch or compression from equilibrium).</p><p><b>Elastic potential energy</b>: PE<sub>s</sub> = ½kx². A compressed spring can launch a block: ½kx² = ½mv² (no friction).</p>',['trace the energy path','<p>“Spring PE → block KE → (on a rough patch) thermal energy from friction.”</p>'],[['Worked example 1','120 N stretches a spring 0.0225 m: k = 5,333 N/m; compressed 0.035 m: PE = 3.27 J.'],['Worked example 2','1.7 kg block stopped by a 955 N/m spring in 0.046 m: ½kx² = 1.01 J = ½mv² → v = 1.09 m/s.'],['Worked example 3','2,000 N/m spring compressed 0.3 m: PE = 90 J; a 0.75 kg block leaves at 15.5 m/s.']],['x is measured from equilibrium, not the spring’s total length.','Square x.','Stiffer spring = larger k.']),practice:[spring,spring,spring,e3],mastery:[spring,spring]},
 {id:'W3',name:'Work & the work-energy theorem',learn:L.learn('ECV1','Work & the work-energy theorem',5,'<p><b>Work</b>: W = Fd cos θ (J), the energy transferred when a force moves an object. Force along the motion → positive; against the motion → negative (friction); perpendicular or no motion → zero (normal force, holding a wall).</p><p><b>Work-energy theorem</b>: W<sub>net</sub> = ΔKE. Gravity’s work depends only on height: W<sub>g</sub> = mgh.</p>',['find the work, then the energy change','<p>“Friction does −12 N × 5 m = −60 J, so the slider ends with 60 J less KE than without friction.”</p>'],[['Worked example 1','Hockey player: 4.5 N over 0.15 m → W = 0.675 J = ΔKE; v = 3.59 m/s for a 0.105 kg puck.'],['Worked example 2','Sailor: 255 N at 25° over 30 m → W = 6,933 J.'],['Worked example 3','75 kg on a slide dropping 2.5 m: W<sub>g</sub> = 1,838 J; v = 7.0 m/s (no friction).']],['Only the force component along the motion counts.','The normal force usually does zero work.','W<sub>net</sub> is the sum of all works.']),practice:[wsign,work,work,work,e3],mastery:[wsign,work,work]},
 {id:'W4',name:'Power & non-conservative work',learn:L.learn('ECV1','Power & non-conservative work',4,'<p><b>Power</b>: P = W ÷ t, in watts (J/s); 1 hp = 746 W. Same work faster → more power. For moving objects, P = Fv.</p><p><b>Non-conservative work</b> (friction, air resistance) changes the mechanical energy: <b>W<sub>nc</sub> = ΔME = (KE + PE)<sub>f</sub> − (KE + PE)<sub>i</sub></b>.</p>',['account for every joule','<p>“The leaf started with 0.88 J of PE and landed with 0.014 J of KE, so air resistance did −0.87 J of work.”</p>'],[['Worked example 1','Motor lifts an elevator 9 m in 15 s with 12,000 N: P = 7,200 W = 9.65 hp.'],['Worked example 2','1,300 kg car from 13.4 to 17.9 m/s in 3 s: ΔKE = 91,555 J; P = 30,500 W.'],['Worked example 3','0.017 kg leaf from 5.3 m lands at 1.3 m/s: W<sub>nc</sub> = 0.0144 − 0.883 = −0.869 J.']],['Power is a rate.','Non-conservative work is usually negative.','Energy “lost” becomes thermal energy.']),practice:[power,power,nc,nc,e3],mastery:[power,nc,e3]}]);

  var h1=pick([1.44,2,3]),h2=pick([0.64,0.8,1]);var m4=0.015;var v1=Math.sqrt(2*g*h1),v2=Math.sqrt(2*g*h2);return {std:'F2',lvl:'3.0',type:'num',prompt:'A <b>0.015 kg</b> marble is dropped from <b>'+h1+' m</b> and bounces straight up to <b>'+h2+' m</b>. What is the size of the impulse from the floor?',answer:m4*(v1+v2),unit:'N·s',tol:0.03,hint:'Find the speed down (√(2gh<sub>1</sub>)) and up (√(2gh<sub>2</sub>)). The direction reverses, so Δv = v<sub>up</sub> + v<sub>down</sub>.',sol:'v<sub>down</sub> = '+s3(v1)+', v<sub>up</sub> = '+s3(v2)+' m/s; J = 0.015('+s3(v1)+' + '+s3(v2)+') = <b>'+s3(m4*(v1+v2))+' N·s</b>.',params:{h1:h1,h2:h2,k:k}};};
var f2c=MC('F2','3.0',[
 ['Why do air bags reduce injuries?','They increase the time of impact, so the same change in momentum happens with a smaller force.',['They increase the force.','They decrease the impact time.','They change the passenger’s momentum to zero instantly.'],'FΔt = Δp.','Same Δp, bigger Δt → <b>smaller F</b>.'],
 ['A car hits a concrete wall; an identical car at the same speed hits a water-filled barrier. What is different?','The force on the passengers and the impact time (the change in momentum is the same).',['The change in momentum.','The final momentum.','Nothing.'],'Both stop from the same speed.','Same Δp; water barrier → longer Δt → smaller F.'],
 ['A bouncy ball and a clay blob of equal mass hit a door at the same speed. Which closes it more effectively?','The bouncy ball, because bouncing back means a larger change in momentum, so a larger impulse on the door.',['The clay','They are equal','Neither'],'Bouncing reverses velocity.','Δp for bouncing is about twice Δp for sticking.'],
 ['Hail instead of rain hits an umbrella at the same rate and speed. How does the force needed to hold the umbrella change?','It increases, because hail bounces off (larger change in momentum) while rain mostly splatters.',['It stays the same.','It decreases.','It becomes zero.'],'Bouncing → bigger Δp.','More impulse per hit → more force.']]);
var inel=function(){var k=pick(['same','head','v_ball']);var m1=pick([95,1200,1875]),m2=pick([111,1025,2600]),v1=pick([2.5,3.75,23]),v2=pick([4.1,6.2,17]);
  if(k==='same'){var vf=(m1*v1+m2*v2)/(m1+m2);return {std:'F3',lvl:'2.0',type:'num',prompt:'A <b>'+m1+' kg</b> car going <b>'+v1+' m/s</b> rear-ends a <b>'+m2+' kg</b> car going <b>'+v2+' m/s</b> in the same direction. They stick together. How fast do they move just after?',answer:vf,unit:'m/s',tol:0.02,hint:'Perfectly inelastic: m<sub>1</sub>v<sub>1</sub> + m<sub>2</sub>v<sub>2</sub> = (m<sub>1</sub> + m<sub>2</sub>)v<sub>f</sub>.',sol:'v<sub>f</sub> = ('+m1+' × '+v1+' + '+m2+' × '+v2+') ÷ '+(m1+m2)+' = <b>'+s3(vf)+' m/s</b>.',params:{m1:m1,m2:m2,v1:v1,v2:v2,k:k}};}
  if(k==='head'){var vf2=(m1*v1-m2*v2)/(m1+m2);return {std:'F3',lvl:'3.0',type:'num',prompt:'A <b>'+m1+' kg</b> object moving at <b>+'+v1+' m/s</b> collides head-on with a <b>'+m2+' kg</b> object moving at <b>−'+v2+' m/s</b>. They stick together. What is their velocity after? Include the sign.',answer:vf2,unit:'m/s',tol:0.03,hint:'Opposite directions → opposite signs. Total momentum before = total after.',sol:'v<sub>f</sub> = ('+m1+'('+v1+') + '+m2+'(−'+v2+')) ÷ '+(m1+m2)+' = <b>'+s3(vf2)+' m/s</b>.',params:{m1:m1,m2:m2,v1:v1,v2:v2,k:k}};}
  var mb=0.007,M=pick([0.95,1.5]),vb=pick([284,300,350]);var vf3=mb*vb/(mb+M);return {std:'F3',lvl:'3.0',type:'num',prompt:'A <b>0.007 kg</b> bullet at <b>'+vb+' m/s</b> embeds in a <b>'+M+' kg</b> block at rest. What is the speed of the block and bullet just after?',answer:vf3,unit:'m/s',tol:0.02,hint:'m<sub>b</sub>v<sub>b</sub> = (m<sub>b</sub> + M)v<sub>f</sub>.',sol:'v<sub>f</sub> = (0.007)('+vb+') ÷ '+(mb+M)+' = <b>'+s3(vf3)+' m/s</b>.',params:{M:M,vb:vb,k:k}};};
var expl=function(){var k=pick(['skate','fire']);
  if(k==='skate'){var mp=pick([57,60]),ms=2.1,mb=pick([1.7,3,5]),vb=pick([10,18]);var vr=-mb*vb/(mp+ms);return {std:'F3',lvl:'3.0',type:'num',prompt:'A <b>'+mp+' kg</b> person on a <b>2.1 kg</b> skateboard, at rest, throws a <b>'+mb+' kg</b> ball east at <b>'+vb+' m/s</b>. What is the person’s recoil velocity? (east = +; include the sign)',answer:vr,unit:'m/s',tol:0.02,hint:'Starts at rest: total momentum = 0 before and after.',sol:'0 = ('+mb+')('+vb+') + ('+(mp+ms)+')v → v = <b>'+s3(vr)+' m/s</b> (west).',params:{mp:mp,mb:mb,vb:vb,k:k}};}
  var m1=pick([0.25,0.4]),v2=pick([8,12]);var m2=1-m1;return {std:'F3',lvl:'3.0',type:'num',prompt:'A <b>1 kg</b> firecracker at rest splits into two pieces. Piece 1 has a mass of <b>'+m1+' kg</b>; piece 2 moves right at <b>'+v2+' m/s</b>. What is the velocity of piece 1? (right = +; include the sign)',answer:-m2*v2/m1,unit:'m/s',tol:0.02,hint:'m<sub>2</sub> = 1 − m<sub>1</sub>. Total momentum stays 0.',sol:'m<sub>2</sub> = '+m2+' kg; 0 = '+m1+'v<sub>1</sub> + '+m2+'('+v2+') → v<sub>1</sub> = <b>'+s3(-m2*v2/m1)+' m/s</b>.',params:{m1:m1,v2:v2,k:k}};};
var twoD=function(){var m1=pick([720,950]),v1=pick([16,22]),m2=pick([1300,1400]),v2=pick([15,21]);var px=m1*v1,py=m2*v2,M=m1+m2;var k=pick(['v','ang']);var vf=Math.sqrt(px*px+py*py)/M,ang=Math.atan2(py,px)*180/Math.PI;
  if(k==='v')return {std:'F3',lvl:'3.0',type:'num',prompt:'A <b>'+m1+' kg</b> car going <b>'+v1+' m/s east</b> collides with a <b>'+m2+' kg</b> van going <b>'+v2+' m/s north</b>. They stick together. What is their speed just after?',answer:vf,unit:'m/s',tol:0.03,hint:'Conserve momentum in x and y separately, then combine: v = √(p<sub>x</sub>² + p<sub>y</sub>²) ÷ total mass.',sol:'p<sub>x</sub> = '+px+', p<sub>y</sub> = '+py+' kg·m/s; v = √(p<sub>x</sub>² + p<sub>y</sub>²) ÷ '+M+' = <b>'+s3(vf)+' m/s</b>.',params:{m1:m1,v1:v1,m2:m2,v2:v2,k:k}};
  return {std:'F3',lvl:'3.0',type:'num',angle:true,prompt:'A <b>'+m1+' kg</b> car going <b>'+v1+' m/s east</b> collides with a <b>'+m2+' kg</b> van going <b>'+v2+' m/s north</b>. They stick together. At what angle (counterclockwise from east) do they move?',answer:ang,unit:'°',tol:1,hint:'θ = tan⁻¹(p<sub>y</sub> ÷ p<sub>x</sub>).',sol:'θ = tan⁻¹('+py+' ÷ '+px+') = <b>'+s3(ang)+'°</b> north of east.',params:{m1:m1,v1:v1,m2:m2,v2:v2,k:k}};};

 ['In a perfectly inelastic collision, is kinetic energy conserved?','No. Momentum is conserved, but some KE becomes heat, sound and deformation.',['Yes, always.','Only if the objects are the same mass.','Momentum isn’t conserved either.'],'Compare KE before and after.','Perfectly inelastic: <b>KE lost</b>, momentum kept.'],

window.REG.physF2=L.MOD('F2','Impulse & momentum',TERMS,null,[{id:'P1',name:'Momentum & impulse',learn:L.learn('F2','Momentum & impulse',5,'<p><b>Momentum</b>: p = mv (kg·m/s), a vector in the direction of the velocity. Big momentum needs big mass, big speed, or both.</p><p><b>Impulse</b>: J = FΔt = Δp = m(v<sub>f</sub> − v<sub>i</sub>). On a force-time graph, impulse is the area under the curve.</p><p><b>Applications:</b> for the same change in momentum, a <b>longer</b> impact time means a <b>smaller</b> force (air bags, crumple zones, padded dashboards, catching with “soft hands”). Bouncing back gives a larger Δp than stopping.</p>',['same Δp, compare F and Δt','<p>“The water barrier stops the car over 0.5 s instead of 0.05 s, so the force is 10 times smaller for the same change in momentum.”</p>'],[['Worked example 1','T-ball: 182 N for 0.009 s on a 0.144 kg ball at rest: J = 1.64 N·s; v = 11.4 m/s.'],['Worked example 2','Bunt: 0.144 kg at +43 m/s, −6,500 N for 0.0013 s: v<sub>f</sub> = 43 − 58.7 = −15.7 m/s.'],['Worked example 3','Marble from 1.44 m bouncing to 0.64 m: v<sub>down</sub> = 5.31, v<sub>up</sub> = 3.54 m/s; J = 0.015(8.85) = 0.133 N·s.']],['Keep signs: a reversal adds speeds in Δv.','Impulse and momentum have the same units (N·s = kg·m/s).','Longer time, smaller force.']),practice:[mom,mom,imp,imp,imp,f2c],mastery:[mom,imp,f2c]}]);
window.REG.physF3=L.MOD('F3','Conservation of momentum',TERMS,null,[{id:'P2',name:'Collisions & explosions',learn:L.learn('F3','Collisions & explosions',6,'<p><b>Law of conservation of momentum</b>: in an isolated system, total momentum before = total momentum after (Newton’s 3rd law makes the impulses equal and opposite).</p>'+T(['Collision','Momentum','Kinetic energy'],[['Elastic','Conserved','Conserved'],['Inelastic','Conserved','Not conserved'],['Perfectly inelastic (stick)','Conserved','Not conserved (most lost)']])+'<p><b>Explosions/recoil</b>: start at rest → total momentum is 0 after too. <b>2-D</b>: conserve x and y separately, then combine with the Pythagorean theorem and tan⁻¹.</p>',['before = after','<p>Write Σp<sub>before</sub> = Σp<sub>after</sub> with signs for direction, then solve for the one unknown.</p>'],[['Worked example 1','1,875 kg at 23 m/s rear-ends 1,025 kg at 17 m/s, stick: v<sub>f</sub> = (43,125 + 17,425) ÷ 2,900 = 20.9 m/s.'],['Worked example 2','Skater (57 + 2.1 kg) throws a 1.7 kg ball 18 m/s east: v = −30.6 ÷ 59.1 = −0.518 m/s (west).'],['Worked example 3','950 kg at 16 m/s E hits 1,300 kg at 21 m/s N, stick: p<sub>x</sub> = 15,200, p<sub>y</sub> = 27,300; v = 13.9 m/s at 60.9° N of E.']],['Momentum is conserved in every collision; KE isn’t always.','Use negative signs for opposite directions.','Total mass after a sticking collision is m<sub>1</sub> + m<sub>2</sub>.']),practice:[ctype,inel,inel,expl,twoD,f3c],mastery:[ctype,inel,expl,f3c]}]);
})();

(function(){var R=L.R,pick=L.pick,MC=L.MC,CLS=L.CLS,T=L.table;
function s3(x){return Number(x.toPrecision(3));}function sci(x){var e=Math.floor(Math.log10(Math.abs(x)));return (x/Math.pow(10,e)).toFixed(2)+' × 10<sup>'+e+'</sup>';}

 {id:'O1',name:'Light, reflection & mirrors',learn:L.learn('OPT1','Light, reflection & mirrors',5,'<p>Light travels at <b>3.0 × 10⁸ m/s</b>. <b>Law of reflection</b>: θ<sub>i</sub> = θ<sub>r</sub>, measured from the normal. A <b>plane mirror</b> makes an upright, same-size, virtual image.</p><p><b>Concave</b> mirrors converge light (f > 0); <b>convex</b> mirrors diverge it (f < 0, always virtual, upright, smaller).</p><p><b>Mirror equation</b>: 1/f = 1/d<sub>o</sub> + 1/d<sub>i</sub>. <b>Magnification</b>: m = −d<sub>i</sub>/d<sub>o</sub> = h<sub>i</sub>/h<sub>o</sub>. Signs: d<sub>i</sub> > 0 real; m < 0 inverted.</p>',['let the signs describe the image','<p>“d<sub>i</sub> = +9 cm (real) and m = −0.5 (inverted, half size).”</p>'],[['Worked example 1','Bulb 18 cm from a concave mirror, f = 6 cm: d<sub>i</sub> = 9 cm (real); m = −0.5.'],['Worked example 2','Cup 10 cm from a concave mirror, f = 15 cm: d<sub>i</sub> = −30 cm (virtual); m = 3; 5 cm cup → 15 cm image.'],['Worked example 3','Convex mirror f = −20 cm, object at 40 cm: d<sub>i</sub> = −13.3 cm (virtual).']],['Flip the fraction at the end: 1/d<sub>i</sub> → d<sub>i</sub>.','Convex mirror f is negative.','Negative m means upside down.']),practice:[light,imgs,mirror,mirror,mirror,imgs],mastery:[mirror,mirror,imgs]},

      var two=out.filter(function(g){return lvlOf(g)!=='3.0';}),thr=out.filter(function(g){return lvlOf(g)==='3.0';});var fin=two.concat(thr);var j=0;while(fin.length<need&&s.practiceAll.length){fin.push(s.practiceAll[j%s.practiceAll.length]);j++;}s.practice=fin.slice(0,need);s.mins+=4;});
    mins=2+live.reduce(function(a,s){return a+s.mins;},0)+live.length*per;}
  return {i:ui,title:u.title,name:u.title.replace(/^Unit \d+:\s*/,''),num:(u.title.match(/Unit (\d+)/)||[])[1]||String(ui+1),note:u.note,stds:stds,live:live,per:per,mins:mins};});

var S={name:'',start:Date.now(),u:null,M:{},R:{}};
function U(){return UNITS[S.u];}
function st(){return S.M[S.u];}
function screens(u){var s=['start','toolkit'];u.live.forEach(function(x,i){s.push('learn:'+i,'prac:'+i);});s.push('mastery','results');return s;}

// ---------- header ----------
function header(){var u=U();$('brand').textContent=u?C.short+' · Unit '+u.num+': '+u.name:C.title;$('homeBtn').style.display=u?'':'none';$('termsBtn').style.display=u?'':'none';
  var el=$('dots');el.innerHTML='';if(u){var sc=screens(u);for(var k=0;k<sc.length;k++){var d=document.createElement('span');d.className='dot'+(k<st().screen?' done':'')+(k===st().screen?' now':'');el.appendChild(d);}}}
function goHome(){S.u=null;render();window.scrollTo(0,0);}
function openUnit(i,jump){S.u=i;if(!S.M[i])S.M[i]={screen:0,prac:{},mastery:null,mres:null,more:null,honors:null};var s=st();s.more=null;s.honors=null;if(jump!=null)s.screen=jump;render();window.scrollTo(0,0);}
function go(i){st().screen=i;st().more=null;st().honors=null;render();window.scrollTo(0,0);var h=$('main').querySelector('h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}}
function nav(prevOk,label,fn){var d=document.createElement('div');d.className='nav';var b=document.createElement('button');b.className='btn';b.type='button';b.textContent='Back';b.disabled=!prevOk;b.onclick=function(){go(st().screen-1);};

// ---------- home ----------
function unitStatus(u){var r=S.R[u.i];if(!r)return '';var solid=r.by.filter(function(b){return b.n&&b.ok/b.n>=0.75;}).length;return solid+' of '+r.by.length+' standards Solid';}

    var pct=r?Math.round(100*r.ok/r.n):0;
    c.innerHTML='<span class="unum">'+u.num+'</span><span class="ubody"><span class="ulabel">Unit '+u.num+'</span><b>'+u.name+'</b><span class="chips">'+u.stds.filter(function(s,i,a){for(var j=0;j<i;j++)if(a[j].code===s.code)return false;return true;}).map(function(s){return '<span class="chip2'+(s.soon?' off':'')+'">'+s.code+'</span>';}).join('')+'</span><span class="umeta">'+(u.live.length?'About '+u.mins+' min'+(r?' · '+unitStatus(u):''):'Coming soon')+'</span>'+(r?'<span class="bar"><span style="width:'+pct+'%"></span></span>':'')+'</span>';
    if(u.live.length)c.onclick=function(){openUnit(u.i,0);};grid.appendChild(c);});
  m.appendChild(grid);
  var done=Object.keys(S.R);var p=document.createElement('div');p.className='panel';
  p.innerHTML='<h2>My results this session</h2>'+(done.length?'<div class="tw"><table><tr><th>Unit</th><th>Mastery check</th><th>Standards Solid</th></tr>'+done.map(function(k){var u=UNITS[k],r=S.R[k];return '<tr><td>Unit '+u.num+': '+u.name+'</td><td>'+r.ok+' / '+r.n+'</td><td>'+unitStatus(u)+'</td></tr>';}).join('')+'</table></div><div class="row noprint"><button class="btn primary" type="button" id="copyAll">Copy my results</button><button class="btn" type="button" id="printAll">Print / save as PDF</button></div><div class="fb" id="copyFb" aria-live="polite"></div>':'<p class="muted">Finish a unit’s mastery check and your results show up here. Nothing is sent anywhere; copy or print them to share with your teacher.</p>');
  m.appendChild(p);if(done.length){$('copyAll').onclick=function(){copyText(allText(),$('copyFb'));};$('printAll').onclick=function(){window.print();};}}

// ---------- unit start (original layout) ----------
function renderStart(m){var u=U();
  m.insertAdjacentHTML('beforeend','<p class="secmeta">'+C.short+' · Unit '+u.num+' · '+u.name+'</p><h1>'+u.name+' review</h1><div class="panel"><p>This review reteaches the '+(u.live.length===1?'Unit '+u.num+' standard':u.live.length+' Unit '+u.num+' standards')+' and lets you practice with instant feedback. It takes about <b>'+u.mins+' minutes</b>. Work on your own; you can go back to any page.</p><p>Each standard has a <b>Learn</b> page and a <b>Practice</b> set. Practice gives you 3 tries, a hint, and a worked solution. At the end, a '+(u.live.length*u.per)+'-question <b>Mastery check</b> shows what to review. Have scratch paper and a calculator ready.</p><div class="namebox"><label for="nm2">Your name (optional, only used on your results):</label><input type="text" id="nm2" autocomplete="off"></div>'+(u.note?'<p class="muted">'+u.note+'</p>':'')+'</div>');
